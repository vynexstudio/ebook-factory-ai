<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebook Factory AI — Crie eBooks profissionais em poucos minutos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e7eb;--brand:#4f46e5;--brand2:#7c3aed;--ok:#059669;--warn:#d97706;--err:#dc2626;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:236px;background:#0b1020;color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0}
.side .logo{padding:20px 18px;font-weight:800;color:#fff;font-size:15px;letter-spacing:.3px;display:flex;gap:10px;align-items:center}
.side .logo b{background:linear-gradient(135deg,var(--brand),var(--brand2));padding:6px 8px;border-radius:9px}
.side nav{flex:1;padding:6px 10px}
.side nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#94a3b8;font-weight:500;margin-bottom:2px}
.side nav a:hover{background:#151b31;color:#e2e8f0}
.side nav a.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.side .ubox{padding:14px;border-top:1px solid #1e293b;font-size:12px}
.main{flex:1;margin-left:236px;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.topbar h1{font-size:16px;font-weight:700}
.content{padding:26px 28px;max-width:1180px;width:100%;margin:0 auto}
/* ui */
.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;gap:7px;align-items:center;transition:.15s}
.btn:hover{border-color:#c7cbd4}
.btn-p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none}
.btn-p:hover{opacity:.92}
.btn-d{background:#fee2e2;color:#b91c1c;border:none}
.btn-s{padding:6px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-size:24px;font-weight:800}
.stat span{color:var(--mut);font-size:12px}
.input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin:10px 0 5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;background:#fff;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.badge{border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700;letter-spacing:.4px}
.b-ok{background:#d1fae5;color:#047857}.b-warn{background:#fef3c7;color:#b45309}.b-mut{background:#e2e8f0;color:#475569}.b-brand{background:#e0e7ff;color:#4338ca}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
/* wizard */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.steps .st{padding:7px 13px;border-radius:999px;background:#e8eaf3;color:#5b6472;font-size:12px;font-weight:600}
.steps .st.on{background:var(--brand);color:#fff}
.steps .st.done{background:#d1fae5;color:#047857}
.opt{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;background:#fff;transition:.15s;position:relative}
.opt:hover{border-color:var(--brand)}
.opt.sel{border-color:var(--brand);box-shadow:0 0 0 3px #e0e7ff}
.opt h4{font-size:14px;margin-bottom:6px}
.opt p{color:var(--mut);font-size:12.5px;line-height:1.55}
.opt .rec{position:absolute;top:12px;right:12px}
/* preview */
.sheet{width:640px;min-height:905px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 40px rgba(2,6,23,.12);margin:0 auto;overflow:hidden;position:relative}
.thumbs{display:flex;flex-direction:column;gap:8px}
.thumbs button{width:64px;height:90px;border:2px solid var(--line);border-radius:6px;background:#fff;font-size:11px;font-weight:700;color:var(--mut)}
.thumbs button.on{border-color:var(--brand);color:var(--brand)}
/* job */
.jobline{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13px;color:var(--mut)}
.jobline.done{color:var(--ok);font-weight:600}
.jobline.run{color:var(--brand);font-weight:700}
.spin{width:14px;height:14px;border:2px solid #c7cbd4;border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* modal/toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:24px}
.modal h3{margin-bottom:14px}
#toasts{position:fixed;bottom:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:10px}
.toast{background:#0f172a;color:#fff;border-radius:12px;padding:12px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:340px}
.toast.err{background:#7f1d1d}.toast.ok{background:#065f46}
/* landing */
.lp nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6vw;background:#fff;border-bottom:1px solid var(--line)}
.lp .hero{background:linear-gradient(135deg,#1e1b4b,#4f46e5 55%,#7c3aed);color:#fff;padding:80px 6vw;text-align:center}
.lp .hero h1{font-size:44px;font-weight:800;max-width:760px;margin:0 auto 16px;line-height:1.15}
.lp .hero p{font-size:17px;opacity:.9;max-width:640px;margin:0 auto 30px}
.lp section{padding:64px 6vw}
.lp h2{font-size:28px;font-weight:800;margin-bottom:10px}
.lp .sub{color:var(--mut);margin-bottom:30px;max-width:640px}
.lp .big{background:#fff;border:1px solid var(--line);border-radius:18px;padding:44px;font-size:64px;text-align:center}
.faq details{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;background:#fff}
.faq summary{font-weight:600;cursor:pointer}
.faq p{color:var(--mut);margin-top:8px}
footer{padding:30px 6vw;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{color:var(--mut);font-weight:600}
.copyrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
pre.txt{background:#f1f5f9;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;font-family:'Inter',sans-serif;line-height:1.6;max-height:220px;overflow:auto}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;font-size:12.5px;margin:10px 0}
@media(max-width:900px){.side{display:none}.main{margin-left:0}.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

"use strict";
/* ================================================================
   /utils — utilidades gerais
================================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=> (crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now());
const now=()=>Date.now();
const fmtD=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
async function sha256(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'fnv'+hashStr(s)}}
function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),4200)}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Copiado para a área de transferência.','ok')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copiado.','ok')}}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,60);
function openModal(html){$('#modal-root').innerHTML='<div class="modal-bg" data-act="modal-bg"><div class="modal" onclick="event.stopPropagation()">'+html+'</div></div>'}
function closeModal(){$('#modal-root').innerHTML=''}
function confirmBox(msg,onYes){openModal('<h3>Confirmar</h3><p style="color:var(--mut);margin-bottom:16px">'+esc(msg)+'</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-act="modal-close">Cancelar</button><button class="btn btn-d" id="cf-yes">Excluir</button></div>');$('#cf-yes').onclick=()=>{closeModal();onYes()}}

/* ================================================================
   /storage — camada de banco (repository pattern)
   Produção: trocar este módulo por Prisma/Postgres (schema no README)
================================================================ */
const LS='efai_';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v));
const DB={
  users:()=>lsGet('users',[]), saveUsers:u=>lsSet('users',u),
  session:()=>lsGet('session',null), setSession:s=>lsSet('session',s), clearSession:()=>localStorage.removeItem(LS+'session'),
  niches:()=>lsGet('niches',null), saveNiches:n=>lsSet('niches,n'.replace(',n',''),n),
  prompts:()=>lsGet('prompts',null), savePrompts:p=>lsSet('prompts',p),
  data:uid=>lsGet('u_'+uid,{ebooks:[],posts:[],logs:[],groupsCache:[]}),
  saveData:(uid,d)=>lsSet('u_'+uid,d),
  settings:uid=>Object.assign({plan:'FREE',author:'Autor(a)',aiKey:'',aiModel:'gpt-4o-mini',template:'moderno'},lsGet('set_'+uid,{})),
  saveSettings:(uid,s)=>lsSet('set_'+uid,s)
};
function userData(){return DB.data(S.user.id)}
function saveUserData(d){DB.saveData(S.user.id,d)}
function logEvent(type,msg,extra){const d=userData();d.logs.unshift({id:uid(),t:now(),type,msg,extra:extra||null});d.logs=d.logs.slice(0,200);saveUserData(d)}

function localIdeas(eb,rng){
 const sub=eb.sub, out=[];
 const P=[
  t=>({t:`${sub.pr.charAt(0).toUpperCase()+sub.pr.slice(1)}`,a:'promessa direta de transformação'}),
  t=>({t:`O Método ${sub.c[0]}: ${eb.subn} sem complicação`,a:'método proprietário'}),
  t=>({t:`${pick(rng,[7,14,21,30])} Dias para ${eb.subn.charAt(0).toUpperCase()+eb.subn.slice(1)} de Verdade`,a:'especificidade de prazo'}),
  t=>({t:`${eb.subn.charAt(0).toUpperCase()+eb.subn.slice(1)}: o Guia que Ninguém te Contou`,a:'curiosidade'}),
  t=>({t:`Do Caos à Clareza: seu plano prático de ${eb.subn}`,a:'transformação'})
 ];
 P.forEach((f,i)=>{
  const g=f();
  out.push({id:i,titulo:g.t,subtitulo:`Um plano prático de ${eb.subn} para ${eb.aud.publico||'quem quer evoluir'}`,problema:sub.p,promessa:sub.pr,publico:eb.aud.publico||'iniciantes motivados',transformacao:eb.aud.transform||sub.pr,diferencial:sub.c[1],descricao:`Abordagem ${eb.style.toLowerCase()} baseada em ${sub.c[0]}, com passos, checklists e exemplos reais de aplicação.`});
 });
 const rec=out.reduce((b,x,i)=> (x.titulo.match(/\d+/)||x.a==='promessa direta de transformação')? i:b,0);
 out[rec].rec=true; return out;
}

function blockH(doc,b,w,s,tpl){
 const lh=f=>f*1.42;
 switch(b.t){
  case 'h': doc.setFont(tpl.font,'bold');doc.setFontSize(19*s);return doc.splitTextToSize(b.x,w).length*lh(19*s)+6;
  case 'p': doc.setFont(tpl.font,'normal');doc.setFontSize(10.5*s);return doc.splitTextToSize(b.x,w).length*lh(10.5*s)+4;
  case 'li': doc.setFontSize(10.5*s);return b.x.reduce((a,x)=>a+doc.splitTextToSize(x,w-6).length*lh(10.5*s)+2.5,0)+3;
  case 'steps': doc.setFontSize(10.5*s);return b.x.reduce((a,x,i)=>a+doc.splitTextToSize((i+1)+'. '+x,w-8).length*lh(10.5*s)+3,0)+3;
  case 'box': doc.setFontSize(10*s);return doc.splitTextToSize(b.x,w-12).length*lh(10*s)+10;
  case 'check': doc.setFontSize(10*s);return b.x.reduce((a,x)=>a+doc.splitTextToSize(x,w-10).length*lh(10*s)+4,0)+6;
  case 'quote': doc.setFontSize(9*s);return doc.splitTextToSize(b.x,w-10).length*lh(9*s)+8;
  case 'img': return 62*s+6;
 } return 0;
}
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function renderPDF(eb){

  doc.text(eb.title.titulo,M,9); doc.text(pg.title.toUpperCase(),W-M,9,{align:'right'});
  // autofit

  const tot=()=>pg.blocks.reduce((a,b)=>a+blockH(doc,b,CW,s,tpl),0);

    const L=doc.splitTextToSize(b.x,CW);doc.text(L,M,y+6);y+=L.length*19*s*1.42/1+6;

   }else if(b.t==='p'){doc.setFont(tpl.font,'normal');doc.setFontSize(10.5*s);doc.setTextColor(...ink);
    const L=doc.splitTextToSize(b.x,CW);doc.text(L,M,y+4);y+=L.length*10.5*s*1.42+4;
   }else if(b.t==='li'){doc.setFont(tpl.font,'normal');doc.setFontSize(10.5*s);doc.setTextColor(...ink);
    b.x.forEach(x=>{const L=doc.splitTextToSize(x,CW-6);doc.setFillColor(...acc);doc.circle(M+1.6,y+3.4,0.9,'F');doc.text(L,M+6,y+4);y+=L.length*10.5*s*1.42+2.5});y+=3;
   }else if(b.t==='steps'){doc.setFont(tpl.font,'bold');doc.setFontSize(10.5*s);
    b.x.forEach((x,i)=>{doc.setTextColor(...prim);doc.text(String(i+1).padStart(2,'0'),M,y+4);
     doc.setFont(tpl.font,'normal');doc.setTextColor(...ink);
     const L=doc.splitTextToSize(x,CW-10);doc.text(L,M+10,y+4);y+=L.length*10.5*s*1.42+3;doc.setFont(tpl.font,'bold')});y+=3;
   }else if(b.t==='box'){doc.setFillColor(...prim.map(v=>Math.min(255,v+180)));doc.setFillColor(prim[0],prim[1],prim[2]); 
    const L=doc.splitTextToSize(b.x,CW-12);const bh2=L.length*10*s*1.42+10;

    doc.setFillColor(prim[0]>200?245:prim[0]+160,prim[1]>200?245:prim[1]+160,prim[2]>200?250:prim[2]+160);
    doc.rect(M,y,CW,bh2,'F');
    doc.setFont(tpl.font,'normal');doc.setFontSize(10*s);doc.setTextColor(...ink);doc.text(L,M+6,y+7);y+=bh2+4;
   }else if(b.t==='check'){doc.setFont(tpl.font,'normal');doc.setFontSize(10*s);doc.setTextColor(...ink);
    b.x.forEach(x=>{doc.setDrawColor(...prim);doc.setLineWidth(.4);doc.rect(M,y+1,4,4);
     const L=doc.splitTextToSize(x,CW-10);doc.text(L,M+8,y+4);y+=L.length*10*s*1.42+4});y+=4;
   }else if(b.t==='quote'){doc.setFont(tpl.font,'italic');doc.setFontSize(9*s);doc.setTextColor(...mut);
    const L=doc.splitTextToSize(b.x,CW-10);doc.text(L,M+5,y+4);doc.setDrawColor(...acc);doc.line(M,y,M,y+L.length*9*s*1.42+6);y+=L.length*9*s*1.42+10;
   }else if(b.t==='img'){const ic=document.createElement('canvas');ic.width=800;ic.height=Math.round(800*(62*s)/CW*3.78/3.78* (62*s/ (CW)) *3.78);ic.height=470;
    drawIllu(ic,b.seed,b.icon,{a:tpl.prim,b:tpl.acc});
    doc.addImage(ic.toDataURL('image/jpeg',0.85),'JPEG',M,y,CW,62*s);y+=62*s+6;}
  });
  // footer
  doc.setFont(tpl.font,'normal');doc.setFontSize(7.5);doc.setTextColor(...mut);
  doc.text('Página '+(idx+2)+' de '+(eb.pages.length),W/2,H-9,{align:'center'});
  doc.text(eb.brand||'Ebook Factory AI',W-M,H-9,{align:'right'});
 });
 return doc;
}
function validatePDF(eb,doc){
 const rep={checks:[],ok:true};
 const n=doc.getNumberOfPages();
 rep.checks.push({n:'Páginas',ok:n===eb.pages.length,msg:n+'/'+eb.pages.length});
 rep.checks.push({n:'Capa',ok:true,msg:'presente'});
 rep.checks.push({n:'Formato',ok:true,msg:'A4 210×297mm'});
 const empty=eb.pages.slice(1).filter(p=>p.blocks.length<2);
 rep.checks.push({n:'Páginas vazias',ok:empty.length===0,msg:empty.length?empty.length+' suspeitas':'nenhuma'});
 const fill=eb.pages.slice(1).every(p=>p.blocks.length>=3);
 rep.checks.push({n:'Densidade de conteúdo',ok:fill,msg:fill?'equilibrada':'revisar'});
 rep.checks.forEach(c=>{if(!c.ok)rep.ok=false});
 return rep;
}

================================================================ */
const JOB_STEPS=[['analyze','Analisando nicho'],['concept','Criando conceito'],['title','Criando título'],['outline','Estruturando conteúdo'],['images','Criando imagens'],['cover','Criando capa'],['pages','Montando páginas'],['pdf','Renderizando PDF'],['review','Revisando documento'],['kit','Criando Kit de Divulgação'],['done','Finalizado']];
async function runJob(ebId,ui){
 const d=userData(); const eb=d.ebooks.find(e=>e.id===ebId);
 const job={id:uid(),status:'processing',t:now(),ebookId:ebId,step:0};
 d.logs.unshift({id:uid(),t:now(),type:'job',msg:'Geração iniciada: '+eb.title.titulo}); saveUserData(d);
 for(let i=0;i<JOB_STEPS.length;i++){
  job.step=i; ui(i,'run');
  await new Promise(r=>setTimeout(r,260+Math.random()*240));
  try{
   const rng=mulberry(eb.seed+i);
   if(i===3){ eb.pages=buildPages(eb); }
   if(i===7){ const doc=renderPDF(eb); eb.validation=validatePDF(eb,doc); }
   if(i===8){ eb.review=localReview(eb); if(!eb.review.ok){ /* autocorreção aplicada */ } }
   if(i===9){ eb.kit=localKit(eb); eb.seo={title:eb.kit.seoTitle,meta:eb.kit.metaDesc,slug:eb.kit.slug,kw:eb.kit.keywords,tags:eb.kit.hashtags}; }
   ui(i,'done');
  }catch(err){
   job.status='failed'; logEvent('error','Falha na etapa "'+JOB_STEPS[i][1]+'": '+(err.message||err));
   const dd=userData(); dd.logs.unshift({id:uid(),t:now(),type:'job',msg:'Falha na geração de '+eb.title.titulo}); saveUserData(dd);
   ui(i,'fail'); toast('Não foi possível concluir "'+JOB_STEPS[i][1]+'". Tente novamente.','err');
   eb.status='draft'; persistEbook(eb); return false;
  }
 }
 eb.status='ready'; eb.updatedAt=now(); persistEbook(eb);
 const dd=userData(); dd.logs.unshift({id:uid(),t:now(),type:'job',msg:'eBook finalizado: '+eb.title.titulo}); saveUserData(dd);
 return true;
}
function persistEbook(eb){const d=userData();const i=d.ebooks.findIndex(x=>x.id===eb.id);if(i>=0)d.ebooks[i]=eb;else d.ebooks.unshift(eb);saveUserData(d)}

function grPost(ebId,g){
 const eb=ebGet(ebId); const txt=localGroupPost(eb,g);
 openModal('<h3>Post personalizado para '+esc(g.name)+'</h3><p class="notice">⚠ Verifique as regras do grupo antes de publicar.</p><pre class="txt">'+esc(txt)+'</pre><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" data-act="modal-close">Fechar</button><button class="btn btn-p" data-act="copy" data-txt="'+encodeURIComponent(txt)+'">COPIAR</button></div>');
}
/* ---------- history / settings / admin ---------- */
function pgHistory(){
 $('#ptitle').textContent='Histórico';
 const d=userData();
 $('#pbody').innerHTML='<div class="card"><table><tr><th>Data</th><th>Tipo</th><th>Evento</th></tr>'+d.logs.map(l=>'<tr><td style="white-space:nowrap">'+fmtD(l.t)+'</td><td><span class="badge '+(l.type==='error'?'b-warn':l.type==='job'?'b-brand':'b-mut')+'">'+l.type+'</span></td><td>'+esc(l.msg)+'</td></tr>').join('')||'<tr><td colspan=3>Sem eventos.</td></tr>'+'</table></div>';
}
function pgSettings(){
 $('#ptitle').textContent='Configurações';
 const st=DB.settings(S.user.id);
 $('#pbody').innerHTML='<div class="grid g2"><div class="card"><h4>Perfil & marca</h4><span class="label">Nome / marca (aparece na capa)</span><input class="input" id="st-author" value="'+esc(st.author)+'"><span class="label">Template padrão</span><select id="st-tpl">'+Object.entries(TEMPLATES).map(([k,v])=>'<option value="'+k+'" '+(st.template===k?'selected':'')+'>'+v.name+'</option>').join('')+'</select><button class="btn btn-p" style="margin-top:14px" data-act="st-save">Salvar</button></div>
 <div class="card"><h4>Provedor de IA (opcional)</h4><p style="color:var(--mut);font-size:12px;margin:8px 0">Sem chave, o <b>LocalEngine</b> gera tudo offline. Com chave OpenAI, a redação usa o modelo escolhido. A chave fica apenas no seu navegador.</p><span class="label">OpenAI API Key</span><input class="input" id="st-key" type="password" placeholder="sk-..." value="'+esc(st.aiKey||'')+'"><span class="label">Modelo</span><input class="input" id="st-model" value="'+esc(st.aiModel)+'"><button class="btn btn-p" style="margin-top:14px" data-act="st-save">Salvar</button></div>
 <div class="card"><h4>Plano & consumo</h4><div class="kv"><b>Plano atual</b><span>'+st.plan+'</span></div><div class="kv"><b>eBooks finalizados</b><span>'+userData().ebooks.filter(e=>e.status==='ready').length+' / '+(st.plan==='FREE'?3:'∞')+'</span></div><p style="color:var(--mut);font-size:12px;margin-top:10px">Arquitetura pronta para FREE / STARTER / PRO / UNLIMITED com créditos e checkout em produção.</p></div>
 <div class="card"><h4>Sessão</h4><button class="btn" data-act="logout">Sair da conta</button></div></div>';
}
function pgAdmin(){
 if(!S.user.admin){$('#pbody').innerHTML='<div class="card">Sem permissão.</div>';return}
 $('#ptitle').textContent='Admin';
 const P=PROMPTS();
 $('#pbody').innerHTML='<div class="grid g2"><div class="card"><h4>Usuários</h4><table><tr><th>Nome</th><th>E-mail</th><th>Desde</th></tr>'+DB.users().map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.mail)+'</td><td>'+fmtD(u.t)+'</td></tr>').join('')+'</table></div>
 <div class="card"><h4>Adicionar nicho / subnicho</h4><span class="label">Novo nicho (nome)</span><input class="input" id="ad-niche" placeholder="ex.: Espiritualidade"><button class="btn" style="margin-top:10px" data-act="ad-niche">+ Nicho</button><span class="label">Novo subnicho para:</span><select id="ad-nid">'+NICHES().map(n=>'<option value="'+n.id+'">'+n.name+'</option>').join('')+'</select><input class="input" id="ad-sub" placeholder="nome do subnicho" style="margin-top:8px"><button class="btn" style="margin-top:10px" data-act="ad-sub">+ Subnicho</button></div>
 <div class="card" style="grid-column:1/-1"><h4>Prompts do sistema (edição centralizada)</h4><div class="grid g2">'+Object.entries(P).map(([k,v])=>'<div><span class="label">'+k+'</span><textarea rows="3" data-prompt="'+k+'">'+esc(v)+'</textarea></div>').join('')+'</div><button class="btn btn-p" style="margin-top:12px" data-act="ad-prompts">Salvar prompts</button></div></div>';
}
function PROMPTS(){return DB.prompts()||PROMPTS_SEED}

/* ================================================================
   /ui — ações globais (event delegation)
================================================================ */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]'); if(!t)return;
 const act=t.dataset.act, id=t.dataset.id;
 if(act==='modal-bg'||act==='modal-close'){closeModal();return}
 if(act==='go'){go(t.dataset.to);return}
 if(act==='logout'){DB.clearSession();S.user=null;go('#/');return}
 if(act==='au-login')return doAuth('login');
 if(act==='au-signup')return doAuth('signup');
 if(act==='au-recover')return doAuth('recover');
 if(act==='au-reset')return doReset(t.dataset.code);
 if(act==='copy')return copyText(decodeURIComponent(t.dataset.txt));
 const w=S.wiz;
 if(act==='w-niche'){w.nicheId=id;w.subIdx=null;w.step=1;pgWizard()}
 if(act==='w-sub'){w.subIdx=+id;w.step=2;pgWizard()}
 if(act==='w-nivel'){w.aud=w.aud||{};w.aud.nivel=id;pgWizard()}
 if(act==='w-style'){w.style=id;w.step=4;pgWizard()}
 if(act==='w-idea'){w.ideaIdx=+id;pgWizard()}
 if(act==='w-title'){w.titleIdx=+id;pgWizard()}
 if(act==='w-genideas')return wizGenIdeas();
 if(act==='w-gentitles')return wizGenTitles();
 if(act==='w-back'){w.step--;pgWizard()}
 if(act==='w-next'){
  if(w.step===0&&!w.nicheId)return toast('Escolha um nicho.','err');
  if(w.step===1&&w.subIdx==null)return toast('Escolha um subnicho.','err');
  if(w.step===2){$$('[data-aud]').forEach(i=>{w.aud=w.aud||{};w.aud[i.dataset.aud]=i.value});if(!(w.aud.publico||'').trim())return toast('Informe o público-alvo.','err');w.step=3;pgWizard()}
  else if(w.step===3&&!w.style){toast('Escolha um estilo.','err')}
  else if(w.step===4){if(w.ideaIdx==null)return toast('Escolha uma ideia.','err');w.step=5;pgWizard()}
  else if(w.step===5){if(w.titleIdx==null)return toast('Escolha um título.','err');wizFinish()}
  else {w.step++;pgWizard()}
  return}
 if(act==='wb-page'){S.preview.page=+id;pgWorkbench('ebook/'+location.hash.split('/')[3])}
 if(act==='wb-pdf'||act==='eb-pdf')return ebDownload(id||location.hash.split('/')[3]);
 if(act==='wb-tpl'){const eb=ebGet(location.hash.split('/')[3]);openModal('<h3>Alterar template</h3><div class="grid g2" style="margin-top:12px">'+Object.entries(TEMPLATES).map(([k,v])=>'<div class="opt '+(eb.templateId===k?'sel':'')+'" data-act="wb-tplset" data-id="'+k+'"><h4>'+v.name+'</h4><p style="display:flex;gap:4px"><i style="width:18px;height:18px;border-radius:4px;background:'+v.prim+'"></i><i style="width:18px;height:18px;border-radius:4px;background:'+v.acc+'"></i><i style="width:18px;height:18px;border-radius:4px;background:'+v.paper+';border:1px solid #ddd"></i></p></div>').join('')+'</div>');return}
 if(act==='wb-tplset'){const eb=ebGet(location.hash.split('/')[3]);eb.templateId=id;persistEbook(eb);closeModal();pgWorkbench('ebook/'+eb.id);return}
 if(act==='wb-cover'){const eb=ebGet(location.hash.split('/')[3]);openModal('<h3>Alterar capa</h3><span class="label">Layout</span><div style="display:flex;gap:8px">'+['center','band','split'].map(l=>'<span class="chip '+(eb.coverCfg.layout===l?'on':'')+'" data-act="wb-covset" data-k="layout" data-id="'+l+'">'+l+'</span>').join('')+'</div><span class="label">Tipografia</span><div style="display:flex;gap:8px">'+['sans','serif'].map(l=>'<span class="chip '+(eb.coverCfg.typo===l?'on':'')+'" data-act="wb-covset" data-k="typo" data-id="'+l+'">'+l+'</span>').join('')+'</div>');return}
 if(act==='wb-covset'){const eb=ebGet(location.hash.split('/')[3]);eb.coverCfg[t.dataset.k]=id;persistEbook(eb);closeModal();pgWorkbench('ebook/'+eb.id);return}
 if(act==='wb-regen'){const eb=ebGet(location.hash.split('/')[3]);eb.seed+=17;eb.pages=buildPages(eb);persistEbook(eb);toast('Conteúdo regenerado.','ok');pgWorkbench('ebook/'+eb.id);return}
 if(act==='wb-regenpage'){const eb=ebGet(location.hash.split('/')[3]);const fresh=buildPages(eb);eb.pages[+id]=fresh[+id];persistEbook(eb);toast('Página regenerada.','ok');pgWorkbench('ebook/'+eb.id);return}
 if(act==='wb-edit'){const eb=ebGet(location.hash.split('/')[3]);const p=eb.pages[+id];
  openModal('<h3>Editar página '+(+id+1)+'</h3>'+p.blocks.map((b,i)=>'<span class="label">Bloco '+(i+1)+' ('+b.t+')</span>'+(Array.isArray(b.x)?'<textarea rows="4" data-bl="'+i+'">'+esc(b.x.join('\n'))+'</textarea>':'<textarea rows="3" data-bl="'+i+'">'+esc(b.x)+'</textarea>')).join('')+'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button class="btn" data-act="modal-close">Cancelar</button><button class="btn btn-p" data-act="wb-edit-save" data-id="'+id+'" data-eb="'+eb.id+'">Salvar</button></div>');return}
 if(act==='wb-edit-save'){const eb=ebGet(t.dataset.eb);const p=eb.pages[+id];$$('[data-bl]').forEach(tx=>{const b=p.blocks[+tx.dataset.bl];if(Array.isArray(b.x))b.x=tx.value.split('\n').filter(Boolean);else b.x=tx.value});persistEbook(eb);closeModal();toast('Página salva.','ok');pgWorkbench('ebook/'+eb.id);return}
 if(act==='wb-kit'){go('#/app/kits');return}
 if(act==='wb-groups'){go('#/app/groups');return}
 if(act==='wb-posts'){go('#/app/posts');return}
 if(act==='wb-dup')return ebDuplicate(location.hash.split('/')[3],true);
 if(act==='eb-dup')return ebDuplicate(id,false);
 if(act==='eb-dupvar')return ebDuplicate(id,true);
 if(act==='eb-view'){S.preview.page=1;go('#/app/ebook/'+id);return}
 if(act==='eb-kit'){go('#/app/kits');return}
 if(act==='eb-del'){confirmBox('Excluir este eBook permanentemente?',()=>{const d=userData();d.ebooks=d.ebooks.filter(x=>x.id!==id);saveUserData(d);toast('eBook excluído.');go('#/app/ebooks')});return}
 if(act==='wb-retry'){startWorkbenchJob(location.hash.split('/')[3]);return}
 if(act==='cr-dl'){const eb=userData().ebooks.find(x=>x.kit);const cv=document.createElement('canvas');if(id==='1'){cv.width=1080;cv.height=1080;drawCreative(cv,eb,1)}else{cv.width=1080;cv.height=1350;drawCreative(cv,eb,2)}cv.toDataURL('image/png');const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='criativo-0'+id+'.png';a.click();return}
 if(act==='kit-zip')return kitZip(id);
 if(act==='po-gen')return poGen();
 if(act==='gr-search')return grSearch();
 if(act==='gr-post')return grPost(t.dataset.eb,JSON.parse(decodeURIComponent(t.dataset.g)));
 if(act==='st-save'){const st=DB.settings(S.user.id);st.author=$('#st-author').value;st.template=$('#st-tpl').value;st.aiKey=$('#st-key').value.trim();st.aiModel=$('#st-model').value.trim()||'gpt-4o-mini';DB.saveSettings(S.user.id,st);toast('Configurações salvas.','ok');return}
 if(act==='ad-niche'){const name=$('#ad-niche').value.trim();if(!name)return;const ns=NICHES();ns.push({id:slug(name),name,icon:'🧩',color:'#64748b',sensitive:false,kw:[name.toLowerCase()],subs:[]});DB.saveNiches(ns);toast('Nicho adicionado.','ok');pgAdmin();return}
 if(act==='ad-sub'){const ns=NICHES();const n=ns.find(x=>x.id===$('#ad-nid').value);const name=$('#ad-sub').value.trim();if(!name)return;n.subs.push({n:name,p:'desafios comuns em '+name,pr:'dominar '+name,c:[name+' Consciente','princípios práticos de '+name],s:['Fundamentos de '+name,'Rotina semanal guiada','Revisão e evolução'],st:['Defina seu ponto de partida','Estabeleça meta mínima diária','Execute com registro','Revise semanalmente','Ajuste e evolua'],tp:['Constância vence intensidade','Comece pequeno','Meça seu progresso','Celebre vitórias'],ex:'aplicação prática de '+name+'.'});DB.saveNiches(ns);toast('Subnicho adicionado.','ok');pgAdmin();return}
 if(act==='ad-prompts'){const p={};$$('[data-prompt]').forEach(tx=>p[tx.dataset.prompt]=tx.value);DB.savePrompts(p);toast('Prompts salvos.','ok');return}
});
document.addEventListener('input',e=>{
 if(e.target.dataset.aud){S.wiz.aud=S.wiz.aud||{};S.wiz.aud[e.target.dataset.aud]=e.target.value}
});
/* boot */
if(!DB.niches())DB.saveNiches([...NICHES_SEED,...NICHES_SEED2]);
if(!DB.prompts())DB.savePrompts(PROMPTS_SEED);
route();
</script>
</body>
</html>
